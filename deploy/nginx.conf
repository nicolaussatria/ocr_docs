# nginx in front of the DocScan workers (docker-compose.yml mounts this as the default site).

# Docker's DNS: 'docscan' answers with every worker container. Asked again every 10 s, so workers
# added, removed or recreated by `docker compose up` are picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream docscan {
    zone docscan 64k;
    least_conn;                      # a new scan goes to the worker with the fewest in progress
    server docscan:8000 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;        # photos and PDFs (the app takes up to 20 MB each), Excel export with pictures
    client_body_timeout 120s;
    proxy_read_timeout 600s;         # a scan waiting in line answers only when its turn is done
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://docscan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a worker that refuses the connection (restarting) is skipped; an upload it already received is never sent twice
    }
}
